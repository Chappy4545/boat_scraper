name: Odds Refresh

on:
  push:
    branches: [master]
    paths:
      - 'docs/data/probs_*.json'   # 朝のupdate後に自動トリガー
  schedule:
    # 毎時0分 (UTC 0-13, 23) = JST 9:00〜23:00
    - cron: '0 0-13,23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 (YYYY-MM-DD, 省略=今日)'
        required: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 2026-08-18: probs に載るレースが 9〜36 から全レース(140-190)に増えた。
    # 1レースあたり2ページ・5並列で 2〜3 分かかるので、10分では際どい。
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh odds
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python main.py refresh_odds "$DATE"
          else
            python main.py refresh_odds
          fi

      # 終了したレースの結果を日中のうちに反映する。
      # 従来は 22:30 の judge まで結果が一切出ず、日中は「賭けた」だけの
      # 状態が続いていた。払戻一覧を1回叩けば終了レースが分かるので、
      # 確定した分だけ bets JSON に書き戻す（DB不要）。
      - name: Judge finished races
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python main.py judge_live "$DATE"
          else
            python main.py judge_live
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 以前は bets_*.json を checkout で破棄していたため、オッズ更新も
          # 結果判定も PWA に反映されていなかった。両方とも commit する。
          git add docs/data/bets_*.json docs/data/meta.json
          if git diff --cached --quiet; then
            echo "変更なし — スキップ"
          else
            git commit -m "auto: refresh odds + judge $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git pull --rebase -X ours origin master; then
              git push
            else
              git rebase --abort
              echo "rebase conflict - skip push this run"
            fi
          fi
