name: PDCA Notify

on:
  push:
    branches: [master]
    paths:
      # pdca.json だけにする。1日1〜2回、夜の判定が書くときだけ動く。
      #
      # ⚠️ bets_*.json を入れてはいけない。クラウドの refresh_odds が15分ごとに
      # push しており、実測（2026-08-24）で1日48コミットが該当した。
      # 通知が48通届くと見なくなり、本当の異常を見落とす。watchdog が
      # 「毎日鳴ると見なくなるため異常時だけ鳴らす」設計なのと同じ理由。
      - 'docs/data/pdca.json'
  workflow_dispatch:
    inputs:
      kind:
        description: 'daily_push | morning_check | judge_done'
        required: true
        default: 'daily_push'
      date:
        description: 'YYYY-MM-DD (省略=今日)'
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine kind
        id: kind
        env:
          # コミットメッセージを ${{ }} でシェルに直接展開してはいけない。
          # 複数行のメッセージだと2行目以降がコマンドとして解釈され、
          # 任意のコードが動く（この repo のコミットは複数行が普通）。
          # env 経由なら値として渡るので展開されない。
          MSG: ${{ github.event.head_commit.message }}
          IN_KIND: ${{ github.event.inputs.kind }}
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=$IN_KIND" >> "$GITHUB_OUTPUT"
            echo "date_arg=$IN_DATE" >> "$GITHUB_OUTPUT"
          else
            # push: commit messageから判定 (auto: update → daily_push, judge → judge_done)
            if echo "$MSG" | grep -qi "judge"; then
              echo "kind=judge_done" >> "$GITHUB_OUTPUT"
            else
              echo "kind=daily_push" >> "$GITHUB_OUTPUT"
            fi
            echo "date_arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          ARGS="--kind ${{ steps.kind.outputs.kind }}"
          if [ -n "${{ steps.kind.outputs.date_arg }}" ]; then
            ARGS="$ARGS --date ${{ steps.kind.outputs.date_arg }}"
          fi
          python scripts/notify.py $ARGS
