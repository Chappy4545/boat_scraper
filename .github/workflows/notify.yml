name: PDCA Notify

on:
  push:
    branches: [master]
    paths:
      # pdca.json だけにする。夜の判定が書くときだけ動く。
      #
      # bets_*.json を外した理由: ローカルからの push が1日に何度もあると
      # そのたびに鳴る（2026-08-23 は夜だけで4回起動している）。欲しいのは
      # 判定サマリーであって、コミットのたびの通知ではない。
      #
      # ⚠️ 訂正（2026-08-24）: 当初「クラウドの refresh_odds が15分ごとに
      # push するので1日48通になる」と書いたが**これは誤り**。
      # GITHUB_TOKEN で行った push は他のワークフローを起動しない
      # （再帰防止）。実際、bets_*.json を含んでいた時期も、クラウドの
      # push では PDCA Notify は一度も起動していない。起動していたのは
      # 常にローカルからの push だけ。
      - 'docs/data/pdca.json'
  workflow_dispatch:
    inputs:
      kind:
        description: 'daily_push | morning_check | judge_done'
        required: true
        default: 'daily_push'
      date:
        description: 'YYYY-MM-DD (省略=今日)'
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Determine kind
        id: kind
        env:
          # コミットメッセージを ${{ }} でシェルに直接展開してはいけない。
          # 複数行のメッセージだと2行目以降がコマンドとして解釈され、
          # 任意のコードが動く（この repo のコミットは複数行が普通）。
          # env 経由なら値として渡るので展開されない。
          MSG: ${{ github.event.head_commit.message }}
          IN_KIND: ${{ github.event.inputs.kind }}
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=$IN_KIND" >> "$GITHUB_OUTPUT"
            echo "date_arg=$IN_DATE" >> "$GITHUB_OUTPUT"
          else
            # push: commit messageから判定 (auto: update → daily_push, judge → judge_done)
            if echo "$MSG" | grep -qi "judge"; then
              echo "kind=judge_done" >> "$GITHUB_OUTPUT"
            else
              echo "kind=daily_push" >> "$GITHUB_OUTPUT"
            fi
            echo "date_arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          ARGS="--kind ${{ steps.kind.outputs.kind }}"
          if [ -n "${{ steps.kind.outputs.date_arg }}" ]; then
            ARGS="$ARGS --date ${{ steps.kind.outputs.date_arg }}"
          fi
          python scripts/notify.py $ARGS
