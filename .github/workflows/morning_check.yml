name: Morning Update Health Check

on:
  schedule:
    # 毎日 10:30 JST (01:30 UTC) と 11:30 JST (02:30 UTC) の2回。
    #
    # ⚠️ morning_predict より後でなければならない。買い目を作るのは
    # 09:30 JST (00:30 UTC) で、所要は13〜14分。
    #
    # 2026-08-24 まで1本目が 08:30 JST に走っており、**買い目が作られる
    # 1時間前に「未実行」と警告していた**。実行履歴でも 23:4x UTC は毎回
    # 失敗、03:2x UTC は毎回成功と、きれいに分かれていた。予測をローカルの
    # 08:00 からクラウドの 09:30 へ移したときに、この時刻を直し忘れていた。
    #
    # GitHub の schedule は遅れることはあっても早まらない（実測15〜96分遅れ）
    # ので、01:30 UTC なら予測の完了後に回る。
    - cron: '30 1 * * *'
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check today's bets exist
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          # JST 日付
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "Checking bets_${TODAY}.json"
          if [ -f "docs/data/bets_${TODAY}.json" ]; then
            echo "OK: found"
          else
            echo "MISSING: bets_${TODAY}.json not found"
            python scripts/notify.py --kind morning_check --date "$TODAY"
          fi
