database:
  url: "sqlite:///data/boatrace.db"
  echo: false

scraping:
  base_url: "https://www.boatrace.jp"
  delay_seconds: 2.0
  timeout: 30
  max_retries: 3
  cache_dir: "data/raw"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

stadiums:
  "01": "桐生"
  "02": "戸田"
  "03": "江戸川"
  "04": "平和島"
  "05": "多摩川"
  "06": "浜名湖"
  "07": "蒲郡"
  "08": "常滑"
  "09": "津"
  "10": "三国"
  "11": "びわこ"
  "12": "住之江"
  "13": "尼崎"
  "14": "鳴門"
  "15": "丸亀"
  "16": "児島"
  "17": "宮島"
  "18": "徳山"
  "19": "下関"
  "20": "若松"
  "21": "芦屋"
  "22": "福岡"
  "23": "唐津"
  "24": "大村"

betting:
  min_expected_value: 1.2       # キャリブレーション後の真のEV（break-even=1.0、20%マージン）
  max_bets_per_race: 5
  min_model_confidence: 0.20
  min_odds: 1.5
  max_odds: 50.0
  # 2026-08-10: 未見データ3期間(5月/6月/7-8月)の検証で 2連複のみ採用。
  #   3連単・3連複は全ルールを試しても全期間黒字の条件が見つからなかったため停止。
  #   (3連単 最良94.3% / 3連複は非単調でノイズ)
  bet_types:
    - "2連複"
  # 買わないが記録だけする賭式（ペーパートレード）。
  # 判定に必要な本数は2連複だけだと約3週間かかるが、賭式を増やせば
  # 同じ日数で3倍のデータが貯まる。単勝は過去データが無く未検証、
  # 3連複はR5の枠組みでは負けたが単独では未評価。
  paper_bet_types:
    - "単勝"
    - "3連複"
    - "3連単"
  bet_type_overrides:
    nirenfuku:
      # 選別ルール R5: model_prob >= 0.30 かつ EV >= 1.2
      #   検証(odds実在レース, モデルは各期間より前のデータのみで訓練):
      #     5月 ROI 130.1% / 6月 178.9% / 7-8月 114.6%  ← 全期間黒字はこの条件のみ
      #     統合 1,101本 的中率30.9% ROI 147.1% (損益分岐比 +7.1SE)
      #   p>=0.20 は統合144%だが7-8月96.6%と赤字のため不採用。
      min_model_prob: 0.30
      # max_model_prob は撤廃。50%以上の帯こそ最良(ROI 171-176%)であり、
      # 旧設定 0.50 は勝てる領域を除外していた。

operation:
  # 検証モード。true の間は買い目を出すだけで、実際には賭けない。
  #
  # 2026-08-13、モデルが市場より正確でないことが確定した。未見データで
  # 対数損失は市場に 3.0% ±0.9 負けており、区分を切っても勝てる場所は
  # 無かった（scripts/find_soft_market.py、独立2窓で確認）。
  # 舟券は pari-mutuel なので、市場と同じ精度なら期待値は必ず
  # 1/1.348 = 0.74。賭け続ければ控除率 25.8% に収束する。
  #
  # 記録・判定・集計はこれまでどおり続くので、検証データは貯まり続ける。
  # 表示される損益は「賭けていたらこうなった」という仮の数字。
  paper_mode: true

  # 検証待ちの候補ルール。
  #
  # ここに書き留める理由: 閾値をあとから動かせる状態だと、同じデータで
  # 何度でも良く見えるルールを作れてしまう。実際 2026-08-13 に、片方の窓で
  # だけ出た候補を2件（オッズが粗い区分 / 直前情報）取り下げている。
  # 次の測定を意味のあるものにするには、条件を先に固定するしかない。
  #
  # まだ採用しない。確認できるまで paper_mode のまま。
  #
  # ── 前任: market_blend（2026-08-13 登録 → 2026-08-24 棄却）────────────
  # p = 0.3*model_prob + 0.7*market_prob, p>=0.10 かつ p*odds>=1.2。
  # 実測43本で 的中9.3% 回収22.8%。オッズが縮んだからではなく
  # **モデルの確率そのものが外れていた**:
  #     モデルの予想 11.9本 / 市場の予想 7.0本 / 実際 4本
  #     モデルが正しいとき4本以下になる確率 0.241% → 棄却
  #     市場が正しいとき                   13.9%  → 矛盾なし
  # このルールは「モデルが市場より強気になった買い目」を選ぶ設計で、
  # そこでは市場のほうが当たっていた。判定は着順から独立に検算済み
  # （43本・不一致0件）。→ memory: project_blend_candidate
  # ────────────────────────────────────────────────────────────────

  candidate_rule:
    name: "shrink_adj"
    # 本番ルール(R5)と条件は同じ。違いは EV を「表示オッズ」ではなく
    # 「締切時にいくらになりそうか(F_hat)」で計算することだけ。
    # つまりこの候補は **選び方の比較** であって、別のモデルではない。
    formula: "F_hat = exp(0.2910 + 0.5527*log(板オッズ) + 0.2899*log(1/model_prob))"
    filter: "R5と同条件（model_prob >= 0.30 かつ model_prob * F_hat >= 1.2）"
    bet_type: "2連複"
    registered: "2026-08-24"
    coef: {a: 0.2910, b: 0.5527, c: 0.2899}

    # なぜ必要か（2026-08-24 実測・本番ルール264本）:
    #   選択時 平均4.75倍 → 確定 平均3.09倍
    #   表示オッズどおり払われていたら 160.7% / 実際 92.5%
    # ただし「オッズ全体が下がる」のではない。確定/板 の中央値は
    #   全15通り 1.079（動かない） / 実際に買った分 0.746（落ちる）
    # ＝**完全に選択の副作用**。EVで選ぶ＝表示オッズが高いものを選ぶ＝
    # まだ票が入っていないものを選ぶ、で、締切までに本来の水準へ戻る。
    #
    # 板だけを説明変数にすると b=0.90 となり「オッズは上がる」という
    # 逆の答えが出る（実際に引っかかった）。板の中で浮いている分を
    # 見抜くには板と独立な情報＝モデル確率が要る。
    #
    # 推定: 1日を伏せて残りで解き伏せた日で確認、を3通り。確定オッズの
    # 当て方が -17.0% / -23.5% / -15.6% と3日とも改善（再現あり）。
    # 係数も b=0.53〜0.57, c=0.28〜0.30 で安定。
    #   scripts/estimate_shrink.py（引数なしで再実行できる）
    found: "確定オッズの予測が3日とも15〜24%改善。回収率が上がるかは未確認"

    # 検証の段取り。
    # 第1段階（済 2026-08-24）: 縮み係数の推定と、伏せた日での再現確認。
    # 第2段階: 本番ルール(板そのまま)と候補(補正後)を毎日並べて記録し、
    #   同じ日・同じレースでどちらが当てるかを対で比べる。対で比べるのは
    #   回収率の引き算より検出力が高いため。
    # 打ち切り 2026-11-30: それまでに差が出なければ追う価値なしと判断。
    stage1_date: "2026-08-24"
    stage2_min_bets: 182
    abandon_date: "2026-11-30"

    # ⚠️ 係数は板が貯まるほど良くなる。推定し直したらここを更新し、
    #    いつの推定かが分かるよう registered も併せて動かすこと。
    coef_estimated_from: "2026-08-21〜23 / 3,390組 / 226レース"

  # 2026-08-19 から対象レースが変わった。それ以前と混ぜて読まないこと。
  #
  # 朝の predict で1本も買わないレースは、組合せごとの行を1行に畳んでいた
  # （ev_calculator の「全買い目が見送り条件に該当」）。畳むと model_prob が
  # 消え、probs_<日付>.json からレースごと落ちる。クラウドの refresh_odds は
  # このファイルしか見ないので、そのレースは日中も評価されない。
  # 実測: 08-17 は 168 中 132 レース、08-18 は 144 中 135 レースが対象外。
  #
  # つまり 08-18 までの記録は「朝のオッズで既存ルールが1本以上買えたレース」
  # だけの成績で、どのバックテストとも母集団が違う。08-19 以降は全レースが
  # 対象になるので、本数は増え、成績の意味も変わる。
  #   候補ルール(混合): 5日で1本 → 数本/日 になる見込み
  #   既存ルール R5   : 日中に条件を満たすレースが増えるぶん本数が増える
  population_changed: "2026-08-19"

  # 現行ルールでの運用開始日。収支の集計はこの日以降だけを対象にする。
  # これより前は別のルール・別のモデルの買い目で、混ぜると現行ルールの
  # 成績が読めなくなる（2026-08-10 の 357 本・-130,420 円が支配的だった）。
  # 過去日を個別に開けば内容は今までどおり見られる。
  live_since: "2026-08-11"

money_management:
  initial_bankroll: 100000
  # 2026-08-11: quarter_kelly → fixed に変更。
  #   R5(2連複 p>=0.30) を未見データで実測したところ、Kelly は1点あたり
  #   上限2,000円に張り付き、24本/日で48,000円（資金の48%）に達していた。
  #   Kelly は「1件ずつ順に賭ける」前提の式で、同日に多数を並列に賭けると
  #   実効レバレッジが本数倍になる。定額の方が挙動が読め、実測も良好:
  #     定額1,000円/本 → 5-6月 最終577,000円(DD16.4%) / 7-8月 140,000円(DD12.0%)
  #     定額 500円/本 → 5-6月 最終338,500円(DD 8.3%) / 7-8月 120,000円(DD 7.0%)
  #   まずは 500円/本で開始し、実績が想定と一致したら増やす。
  strategy: "fixed"
  fixed_bet_amount: 500
  max_bet_per_race: 1000
  max_bet_per_day: 15000     # 想定 13〜24本/日 × 500円 に対する安全弁
  # 停止条件は実測に合わせた。R5 の実測では最長連敗 12〜14回、
  # 最大DD 31.2% が「正常な範囲」で発生する（的中率31%なら10連敗の確率は2.5%、
  # 1,100本なら8回以上起きる）。旧設定(連敗10 / DD30%)では正常な変動で
  # 運用が止まってしまうため緩めた。
  max_drawdown_stop: 0.45
  max_consecutive_losses_stop: 25

model:
  version: "v1"
  cv_folds: 5
  test_ratio: 0.20
  random_state: 42
  calibration: true
  # 2026-07-05: LambdaRank + Plackett-Luce の切替スイッチ
  # true: ranker のスコアから Plackett-Luce で joint probability を導出（calibration_factor不要）
  # false: 従来の独立win/top2/top3モデル + calibration_factor
  # 2026-07-06: バックテスト比較 (6/14-6/27) で 損益 -12,420→-120 の劇的改善 → true化
  use_ranker: true
  pl_temperature: 1.0   # softmax温度 (小さい=より鋭く、大きい=より均等)

api:
  host: "0.0.0.0"
  port: 8000
  debug: false

logging:
  level: "INFO"
  dir: "logs"
